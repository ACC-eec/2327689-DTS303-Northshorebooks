services:
  mysql:
    image: mysql:8.0
    container_name: northshore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-northshore_root_pw}
      MYSQL_DATABASE: ${DB_NAME:-northshore_books}
      MYSQL_USER: ${DB_USER:-northshore}
      MYSQL_PASSWORD: ${DB_PASSWORD:-northshore_root_pw}
    ports:
      - "3306:3306"
    volumes:
      - northshore_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  northshore_mysql_data:
